name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extension release tag, e.g. v0.1.2 (must match vscode-extension/package.json)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "Extension tag must start with 'v': $TAG" >&2; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./vscode-extension/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match vscode-extension/package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing extension $TAG"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run core tests
        run: dotnet test tests/TokenTracker.Core.Tests/TokenTracker.Core.Tests.csproj -c Release --nologo

  extension:
    runs-on: ubuntu-latest
    needs: [meta]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile

      - name: Package VSIX
        working-directory: vscode-extension
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          npx --yes @vscode/vsce package --allow-missing-repository --no-dependencies
          mkdir -p ../artifacts
          VSIX=$(ls tokentracker-*.vsix | head -n 1)
          test -n "$VSIX"
          cp "$VSIX" "../artifacts/tokentracker-$VERSION.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: artifacts/tokentracker-*.vsix
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [meta, test, extension]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: extension
          path: artifacts

      - name: List assets
        run: ls -lh artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "Token Tracker $TAG" \
              --generate-notes
          fi
