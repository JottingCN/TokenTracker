name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (must match vscode-extension/package.json)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            vscode-extension/package-lock.json

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { $env:REF_NAME } else { $env:INPUT_TAG }
          if (-not $tag.StartsWith('v')) {
            throw "Release tag must start with 'v': $tag"
          }
          $version = $tag.Substring(1)
          $packageVersion = (Get-Content vscode-extension/package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            throw "Tag $tag does not match vscode-extension/package.json version $packageVersion"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Releasing $tag"

      - name: Run core tests
        run: dotnet test tests/TokenTracker.Core.Tests/TokenTracker.Core.Tests.csproj -c Release --nologo

      - name: Build web dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build extension and bundled server
        working-directory: vscode-extension
        run: |
          npm ci
          npm run build

      - name: Package VSIX
        working-directory: vscode-extension
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run package
          New-Item -ItemType Directory -Force -Path ../artifacts | Out-Null
          $vsix = Get-ChildItem -Filter 'tokentracker-*.vsix' | Select-Object -First 1
          if (-not $vsix) {
            throw 'VSIX was not produced'
          }
          Copy-Item $vsix.FullName "../artifacts/tokentracker-extension-$env:VERSION.vsix"

      - name: Package standalone server
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Compress-Archive -Path 'vscode-extension/server/*' `
            -DestinationPath "artifacts/tokentracker-server-$env:VERSION-win-x64.zip" -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokentracker-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG artifacts/* --clobber
          } else {
            gh release create $env:TAG artifacts/* `
              --target $env:TARGET_SHA `
              --title "Token Tracker $env:TAG" `
              --generate-notes
          }
